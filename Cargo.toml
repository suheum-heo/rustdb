[package]
name = "rustdb"
version = "0.1.0"
edition = "2024"
description = "A small relational SQL engine with a page-oriented database file"
readme = "README.md"
publish = false

[dependencies]
fs4 = "0.13.1"
sqlparser = "0.64.0"

[dev-dependencies]
# Property tests in src/storage/reliability.rs. Not used by the library.
proptest = "1.6"

[features]
# Exposes byte-oriented decoders for the separate fuzz crate. Normal builds
# keep that module crate-private, so `cargo test` does not need nightly.
fuzz = []
