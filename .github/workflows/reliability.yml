name: Reliability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  properties:
    name: longer property tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@2656b87321093db1cb55fbd73183d195214fdfd1 # v2.5.0

      - name: Property tests
        env:
          PROPTEST_CASES: "256"
        run: |
          set -euo pipefail
          cargo test --locked --lib storage::reliability -- --list \
            | grep -q 'storage::reliability::records_round_trip_or_reject_overflow'
          cargo test --locked --lib storage::reliability
